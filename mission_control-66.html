<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Platform Engineer · Mission Control v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root{
 --bg:#0e1117;
 --surface:#161b22;
 --card:#1c2128;
 --border:#30363d;
 --border2:#21262d;
 --blue:#58a6ff;
 --green:#3fb950;
 --yellow:#d29922;
 --orange:#f78166;
 --red:#f85149;
 --purple:#bc8cff;
 --teal:#39d353;
 --text:#e6edf3;
 --dim:#8b949e;
 --white:#ffffff;
 --accent:#58a6ff;
 --line:#30363d;
 --dim:#8b949e;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
 background:var(--bg);
 color:var(--text);
 font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
 font-size:13px;line-height:1.5;min-height:100vh;
}

/* TOP BAR */
.top-clock-bar{
 position:fixed;top:0;left:0;right:0;height:50px;
 background:var(--surface);
 border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 16px;z-index:9999;
}
.top-clock-bar .clock-left{display:flex;align-items:center;gap:10px}
.top-clock-bar .clock-svg-wrap{position:relative;width:34px;height:34px}
.top-clock-bar svg{width:34px;height:34px;transform:rotate(-90deg)}
.clock-track{fill:none;stroke:#30363d;stroke-width:3}
.clock-arc-hr{fill:none;stroke:#f78166;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.clock-arc-min{fill:none;stroke:#58a6ff;stroke-width:2;stroke-linecap:round;transition:stroke-dashoffset 0.5s}
.clock-dot{fill:#fff}
.clock-time-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);font-size:7px;font-family:monospace;color:#fff;font-weight:700;white-space:nowrap}
.devops-tag{font-size:10px;padding:3px 10px;border:1px solid var(--border);color:var(--dim);border-radius:20px;font-weight:500}
.clock-date{font-size:11px;color:var(--dim)}

/* LAYOUT */
.app-shell{display:block;margin-top:50px;min-height:calc(100vh - 50px)}

/* SIDEBAR */
.sidebar{
 width:60px;
 background:linear-gradient(180deg,#0d1117 0%,#161b22 100%);
 border-right:1px solid var(--border);
 position:fixed;top:50px;left:0;bottom:0;
 display:flex;flex-direction:column;
 overflow:hidden;
 transition:width 0.25s cubic-bezier(.4,0,.2,1);
 z-index:500;
 box-shadow:2px 0 16px rgba(0,0,0,0.5);
}
.sidebar.expanded{width:210px}

.sidebar-toggle{
 display:flex;align-items:center;gap:10px;
 height:48px;cursor:pointer;padding:0 18px;
 border-bottom:1px solid rgba(255,255,255,0.06);
 color:var(--dim);flex-shrink:0;
 transition:color 0.15s,background 0.15s;
 user-select:none;overflow:hidden;
}
.sidebar-toggle:hover{color:var(--blue);background:rgba(88,166,255,0.06)}
.sidebar-toggle .tog-icon{font-size:13px;flex-shrink:0;transition:transform 0.25s;line-height:1}
.sidebar.expanded .tog-icon{transform:rotate(180deg)}
.sidebar-toggle .tog-label{font-size:9px;font-weight:600;letter-spacing:1.5px;color:var(--dim);white-space:nowrap;opacity:0;transition:opacity 0.2s;text-transform:uppercase}
.sidebar.expanded .tog-label{opacity:1}

.sb-section{
 font-size:8px;letter-spacing:1.5px;color:rgba(139,148,158,0.6);
 padding:12px 0 3px 20px;white-space:nowrap;overflow:hidden;
 opacity:0;transition:opacity 0.2s;text-transform:uppercase;
}
.sidebar.expanded .sb-section{opacity:1}

.sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0}
.sidebar-nav::-webkit-scrollbar{width:2px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--border2)}

.tab{
 background:transparent;border:none;
 border-left:3px solid transparent;
 color:var(--dim);
 padding:0;height:46px;
 font-size:10px;font-weight:500;font-family:inherit;
 cursor:pointer;
 display:flex;flex-direction:row;align-items:center;
 gap:0;width:100%;
 transition:color 0.15s,background 0.15s,border-color 0.15s;
 white-space:nowrap;overflow:hidden;
 position:relative;
}
.tab:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.tab.active{
 color:var(--blue);border-left-color:var(--blue);
 background:linear-gradient(90deg,rgba(88,166,255,0.13),transparent);
}
.tab-icon{
 font-size:17px;
 width:60px;flex-shrink:0;
 display:flex;align-items:center;justify-content:center;
 transition:transform 0.15s;
}
.tab:hover .tab-icon{transform:scale(1.18)}
.tab-label{
 font-size:11px;font-weight:500;
 opacity:0;transition:opacity 0.18s;
 pointer-events:none;flex:1;
}
.sidebar.expanded .tab-label{opacity:1}

/* tooltip */
.tab::after{
 content:attr(data-tooltip);
 position:fixed;left:68px;
 background:#1c2128;border:1px solid var(--border);
 color:var(--text);font-size:11px;padding:5px 11px;
 border-radius:6px;white-space:nowrap;
 opacity:0;pointer-events:none;
 transition:opacity 0.12s;z-index:9999;
 box-shadow:0 4px 14px rgba(0,0,0,0.6);
}
.tab:hover::after{opacity:1}
.sidebar.expanded .tab::after{opacity:0!important;pointer-events:none}

/* active dot */
.tab.active::before{
 content:'';position:absolute;right:10px;top:50%;transform:translateY(-50%);
 width:5px;height:5px;border-radius:50%;background:var(--blue);
 opacity:0;transition:opacity 0.2s;
}
.sidebar.expanded .tab.active::before{opacity:1}

/* sidebar footer */
.sidebar-footer{
 border-top:1px solid rgba(255,255,255,0.05);
 padding:8px 0;flex-shrink:0;overflow:hidden;
}
.sb-foot-row{
 display:flex;align-items:center;gap:10px;
 padding:5px 18px;white-space:nowrap;overflow:hidden;
}
.sb-foot-dot{
 width:7px;height:7px;border-radius:50%;background:var(--green);
 flex-shrink:0;
 animation:sbpulse 2.5s ease-in-out infinite;
}
@keyframes sbpulse{0%,100%{box-shadow:0 0 0 0 rgba(63,185,80,0.5)}50%{box-shadow:0 0 0 5px rgba(63,185,80,0)}}
.sb-foot-label{opacity:0;transition:opacity 0.2s;font-size:9px;color:var(--dim);letter-spacing:0.5px}
.sidebar.expanded .sb-foot-label{opacity:1}

/* MAIN CONTENT */
.wrap{
 margin-left:60px;
 padding:0 14px 80px;
 transition:margin-left 0.25s cubic-bezier(.4,0,.2,1);
 max-width:880px;
}
body.sb-open .wrap{margin-left:210px}

/* HEADER */
.hdr{
 background:linear-gradient(135deg,#161b22 0%,#1c2128 100%);
 border:1px solid var(--border);
 border-radius:12px;
 padding:20px;
 margin:12px 0;
 position:relative;
 overflow:hidden;
}
.hdr::before{
 content:'';position:absolute;top:0;right:0;
 width:200px;height:100%;
 background:linear-gradient(135deg,transparent,rgba(88,166,255,0.05));
 pointer-events:none;
}
h1{font-size:22px;font-weight:700;color:var(--white);letter-spacing:-0.5px;margin-bottom:4px}
.meta{font-size:11px;color:var(--dim);letter-spacing:0.3px}

/* TABS — see sidebar section above */

/* PANELS */
.panel{
 background:var(--surface);
 border:1px solid var(--border);
 border-radius:8px;
 padding:16px;
 margin-bottom:10px;
}
.panel h2{
 font-size:12px;font-weight:600;
 color:var(--dim);
 letter-spacing:0.8px;text-transform:uppercase;
 margin-bottom:14px;padding-bottom:10px;
 border-bottom:1px solid var(--border2);
}

/* DAY CARDS */
.day{
 background:var(--card);
 border:1px solid var(--border2);
 border-radius:8px;
 padding:14px;margin-bottom:8px;
 transition:border-color 0.2s;
}
.day.today{
 border-color:var(--blue);
 background:linear-gradient(135deg,#1c2128,#1a2332);
}
.day.done{opacity:0.5}
.day-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.day-t{font-size:14px;font-weight:600;color:var(--white)}
.shift-tag{
 font-size:10px;padding:2px 10px;
 background:rgba(88,166,255,0.1);
 border:1px solid rgba(88,166,255,0.3);
 color:var(--blue);border-radius:20px;font-weight:500;
}
.focus-line{font-size:11px;color:var(--dim);margin-bottom:6px}
.focus-line.warn{color:var(--yellow);font-weight:500}
.windows{
 font-size:10px;color:var(--teal);
 margin-bottom:10px;padding:5px 10px;
 background:rgba(63,185,80,0.06);
 border-left:2px solid var(--green);
 border-radius:0 4px 4px 0;
}
.blink{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* TASKS */
.task-l{
 font-size:9px;font-weight:600;color:var(--dim);
 letter-spacing:1px;text-transform:uppercase;
 margin:12px 0 5px;
 display:flex;align-items:center;gap:8px;
}
.task-l::after{content:'';flex:1;height:1px;background:var(--border2)}
.chk{
 display:flex;align-items:flex-start;gap:8px;
 padding:6px 8px;border-radius:6px;margin-bottom:2px;
 cursor:pointer;transition:background 0.1s;
}
.chk:hover{background:rgba(255,255,255,0.03)}
input[type=checkbox]{
 appearance:none;width:15px;height:15px;
 border:1.5px solid var(--border);
 background:transparent;cursor:pointer;
 border-radius:4px;flex-shrink:0;margin-top:1px;
 position:relative;transition:all 0.15s;
}
input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
input[type=checkbox]:checked::after{content:"✓";position:absolute;top:-2px;left:2px;font-size:11px;color:#000;font-weight:900}
.timeslot{font-size:10px;color:var(--dim);margin-right:4px;min-width:86px;display:inline-block}
.dur{font-size:10px;padding:1px 6px;border:1px solid var(--border2);border-radius:10px;color:var(--dim);margin-left:4px}
.dur.skip{text-decoration:line-through;opacity:0.4}

/* BUTTONS */
.btn{
 background:transparent;
 border:1px solid var(--border);
 color:var(--text);
 padding:5px 12px;font-size:11px;
 font-family:inherit;border-radius:6px;
 cursor:pointer;transition:all 0.15s;font-weight:500;
}
.btn:hover{background:rgba(88,166,255,0.1);border-color:var(--blue);color:var(--blue)}
.btn.on{background:var(--blue);border-color:var(--blue);color:#000;font-weight:600}

/* STAT BOXES */
.dash{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stat-box{
 flex:1;min-width:70px;
 background:var(--card);
 border:1px solid var(--border2);
 border-radius:8px;padding:12px 8px;text-align:center;
}
.stat-box b{display:block;font-size:22px;font-weight:700;color:var(--white);margin-bottom:2px}
.stat-box{font-size:9px;color:var(--dim);letter-spacing:0.5px;text-transform:uppercase}

/* BARS */
.bar{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin:4px 0}
.bar-fill{height:100%;background:var(--green);border-radius:3px;transition:width 0.4s}
.wk-bars{display:flex;flex-direction:column;gap:5px}
.wk-bar-row{display:flex;align-items:center;gap:8px}
.wk-bar-label{font-size:10px;color:var(--dim);width:36px;font-weight:500}
.wk-bar-track{flex:1;height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden}
.wk-bar-fill{height:100%;background:var(--blue);border-radius:3px;transition:width 0.4s}
.wk-bar-pct{font-size:10px;color:var(--dim);width:28px;text-align:right}

/* HEATMAP */
.heatmap{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}
.hm-sq{width:11px;height:11px;border-radius:2px;background:rgba(255,255,255,0.05);cursor:pointer;transition:all 0.1s}
.hm-sq.done{background:var(--green)}
.hm-sq.today{background:var(--blue);box-shadow:0 0 6px rgba(88,166,255,0.5)}
.hm-sq.future{opacity:0.2}
.hm-sq:hover{transform:scale(1.5)}

/* FOCUS */
.focus-screen{position:fixed;inset:0;background:rgba(14,17,23,0.98);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;text-align:center}
.focus-timer{font-size:80px;font-weight:200;letter-spacing:-3px;color:var(--white);font-variant-numeric:tabular-nums}
.focus-label{font-size:12px;color:var(--dim);margin:8px 0 20px;letter-spacing:2px;text-transform:uppercase}
.focus-msg{font-size:11px;color:var(--orange);border:1px solid rgba(247,129,102,0.4);padding:6px 16px;border-radius:6px;margin-bottom:24px}

/* SHIFT BUTTONS */
.shift-btn{background:transparent;border:1px solid var(--border2);color:var(--dim);padding:4px 10px;font-size:10px;font-family:inherit;border-radius:6px;cursor:pointer;transition:all 0.15s}
.shift-btn:hover{border-color:var(--blue);color:var(--blue)}
.shift-btn.on{background:rgba(88,166,255,0.15);border-color:var(--blue);color:var(--blue);font-weight:600}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg);color:var(--dim);font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:10px;letter-spacing:0.8px;text-transform:uppercase}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:top}
tr:hover td{background:rgba(255,255,255,0.015)}

/* INPUTS */
input[type=text],input[type=number],textarea,select{
 background:var(--bg);border:1px solid var(--border);
 color:var(--text);padding:6px 10px;font-size:12px;
 font-family:inherit;border-radius:6px;outline:none;
 transition:border-color 0.15s;
}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(88,166,255,0.1)}

/* LINKS */
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* MISC */
.muted{color:var(--dim);font-size:11px}
pre,.code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;background:var(--bg);padding:10px;border-radius:6px;border:1px solid var(--border);color:var(--text);white-space:pre-wrap}

/* TOOLS */
.tool-row{display:grid;grid-template-columns:130px 1fr 50px 60px;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03);align-items:start}
.tool-name{font-weight:600;font-size:12px;color:var(--white)}
.tool-desc{font-size:11px;color:var(--dim);line-height:1.4}
.tool-wk{font-size:10px;color:var(--orange);text-align:center}

/* ROADMAP */
.rm-item{display:flex;gap:12px;margin-bottom:6px;padding:10px;background:var(--card);border:1px solid var(--border2);border-radius:8px}
.rm-wk{font-size:11px;font-weight:700;color:var(--orange);min-width:40px;padding-top:2px}
.rm-title{font-size:12px;font-weight:600;color:var(--white);margin-bottom:3px}
.rm-items{font-size:10px;color:var(--dim);line-height:1.6}

/* PIPELINE */
body::after{content:'';position:fixed;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--green),var(--yellow),var(--orange),var(--blue));background-size:300% 100%;animation:pf 4s linear infinite;z-index:10000}
@keyframes pf{from{background-position:100% 0}to{background-position:0 0}}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* WINDOWS */
.windows{font-size:10px;color:var(--teal);margin-bottom:10px;padding:5px 10px;background:rgba(63,185,80,0.06);border-left:2px solid var(--green);border-radius:0 4px 4px 0}
#alert-zone{margin:8px 0}
</style>
</head>
<body>

<div class="top-clock-bar">
 <div class="clock-left">
  <div class="clock-svg-wrap">
   <svg viewBox="0 0 36 36">

<!-- VERTICAL SIDEBAR -->

<script>
const KEY="pe_mc_v9";
const WEEK_START=new Date(2026,4,11);

function getGeminiKey(){return localStorage.getItem("gemini_api_key")||""}
function setGeminiKey(k){localStorage.setItem("gemini_api_key",k)}
async function callAI(prompt,maxTokens=300){
 const apiKey=getGeminiKey();
 if(!apiKey){
  return "⚠ No Gemini API key. Go to [08] CONFIG → enter your free key from aistudio.google.com";
 }
 try{
  const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+apiKey,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    contents:[{parts:[{text:prompt}]}],
    generationConfig:{maxOutputTokens:maxTokens,temperature:0.7}
   })
  });
  const data=await res.json();
  if(data.error)return "⚠ Gemini error: "+( data.error.message||"Unknown error")+"\n\nCheck your API key in [08] CONFIG";
  return data.candidates?.[0]?.content?.parts?.[0]?.text||"No response from Gemini";
 }catch(e){
  return "⚠ Network error: "+e.message+"\n\nCheck internet connection and try again";
 }
}

const SHIFTS={
 holiday:{n:"HOLIDAY",h:6,d:"Full day free · study 09:00-13:00 + 16:00-18:00 · 6h total"},
 leave:{n:"LEAVE",h:4,d:"Day off · study 10:00-14:00 · 4h total",ask:1},

function generatePlan(){
 const plan=[];
 for(let dayIdx=0;dayIdx<126;dayIdx++){
  const wk=Math.floor(dayIdx/7)+1;
  const dow=dayIdx%7;
  const cfg=WEEK_CFG[wk-1];
  if(!cfg)break;
  const date=new Date(WEEK_START);date.setDate(date.getDate()+dayIdx);
  const dStr=fmt(date);
  const actualDow=date.getDay();
  const DOW_MAP=["SUN","MON","TUE","WED","THU","FRI","SAT"];
  const day={d:dStr,dy:DOW_MAP[actualDow],wk:wk,dow:dow};

  const dayCfg=cfg.days?.[dow];
  const courseKey=dayCfg?.c||null;

  if(courseKey){
   const mins=C_MIN[courseKey]?.[dow]||90;
   day.c1={k:courseKey,s:dayCfg.topic||sectionFor(courseKey,wk,dow),m:mins};
  }

  const doLC=dayCfg?.lc||false;
  if(doLC)day.lc=POOL_LC[dayIdx%POOL_LC.length];

  const doHRpy=dayCfg?.hrpy||false;
  if(doHRpy)day.hr1=POOL_PYHR[dayIdx%POOL_PYHR.length];

  const doHRlx=dayCfg?.hrlx||false;
  if(doHRlx)day.hr2=POOL_LXHR[dayIdx%POOL_LXHR.length];

  if(dayCfg?.kk)day.kk=dayCfg.kk;

  day.ai=AI_TASKS[dayIdx%AI_TASKS.length];

  day.f=dayCfg?.topic||cfg.t||"Study day";

  if(dStr==="2026-05-13"){day.f="⚠ DERMATOLOGIST 10:45 · "+day.f;day.intr=1}

  plan.push(day);
 }
 return plan;
}

  if(remaining<=0)break;
  const len=Math.min(remaining,maxLen);
  if(len>0)blocks.push({start,len});
  remaining-=len;
 }
 return blocks;
}

function allocateTimes(blocks,taskMins){
 const out=[];let bi=0,cursor=blocks[0]?blocks[0].start:6*60,blockUsed=0;
 for(const m of taskMins){
  while(bi<blocks.length&&blockUsed+m>blocks[bi].len){bi++;if(bi<blocks.length){cursor=blocks[bi].start;blockUsed=0}}
  if(bi>=blocks.length){out.push(null);continue}
  const start=cursor,end=start+m;
  out.push(fmtTime(start)+"-"+fmtTime(end));
  cursor=end;blockUsed+=m;
 }
 return out;
}

function alignCourses(day,hours){
 const all=[day.c1,day.c2,day.c3].filter(Boolean);
 const cap=Math.max(0,hours*60-30);
 let acc=0,kept=[];
 for(const c of all){if(acc+c.m<=cap){kept.push(c);acc+=c.m}else kept.push({...c,skip:1})}
 return kept;
}

function wireAbort(holdSecs){
 const btn=document.getElementById("abort-btn");if(!btn)return;
 const ms=holdSecs*1000;
 const start=()=>{
  let held=0;
  abortHoldTimer=setInterval(()=>{
   held+=100;
   if(btn)btn.textContent="[ ABORTING IN "+Math.ceil((ms-held)/1000)+"... ]";
   if(held>=ms){clearInterval(abortHoldTimer);clearInterval(focusTimer);failCount++;document.getElementById("focus-zone").innerHTML="";showFailEscalation()}
  },100);
 };
 const stop=()=>{if(abortHoldTimer){clearInterval(abortHoldTimer);abortHoldTimer=null;if(btn)btn.textContent="[ HOLD "+holdSecs+"s TO ABORT ]"}};
 btn.onmousedown=start;btn.ontouchstart=e=>{e.preventDefault();start()};
 btn.onmouseup=stop;btn.onmouseleave=stop;btn.ontouchend=stop;btn.ontouchcancel=stop;
}

let taskTimerIntervals={};

function initPerf(){if(!state.perf)state.perf={dayTimers:{},taskTimers:{},weekScores:{},dailyLog:[]}}

function startTaskTimer(dateKey,taskKey,plannedMins){
 initPerf();
 const k=dateKey+":"+taskKey;
 state.perf.taskTimers[k]={planned:plannedMins,startedAt:Date.now(),actual:0,overtime:false,reason:"",aiVerdict:""};
 save();
 if(taskTimerIntervals[k])clearInterval(taskTimerIntervals[k]);
 taskTimerIntervals[k]=setInterval(()=>tickTaskTimer(dateKey,taskKey),1000);
 render();
}

function tickTaskTimer(dateKey,taskKey){
 initPerf();
 const k=dateKey+":"+taskKey;
 const tt=state.perf.taskTimers[k];if(!tt||!tt.startedAt)return;
 tt.actual=Math.floor((Date.now()-tt.startedAt)/1000);
 const overtime=tt.actual>tt.planned*60;
 tt.overtime=overtime;
 // Update display only — don't re-render (too expensive)
 const disp=document.getElementById("tdisp_"+dateKey+"_"+taskKey);
 const wrap=document.getElementById("twrap_"+dateKey+"_"+taskKey);
 if(disp){
  const rem=tt.planned*60-tt.actual;
  if(rem>0){disp.textContent=pad(Math.floor(rem/60))+":"+pad(rem%60)}
  else{disp.textContent="+"+pad(Math.floor(-rem/60))+":"+pad((-rem)%60)}
 }
 if(wrap){
  wrap.className="task-timer"+(overtime?" timer-overtime":" timer-running");
 }

 if(overtime){
  const rb=document.getElementById("rbox_"+dateKey+"_"+taskKey);
  if(rb)rb.style.display="block";
 }
 save();
}

function stopTaskTimer(dateKey,taskKey){
 const k=dateKey+":"+taskKey;
 if(taskTimerIntervals[k]){clearInterval(taskTimerIntervals[k]);delete taskTimerIntervals[k]}
 initPerf();
 const tt=state.perf.taskTimers[k];
 if(tt)tt.stoppedAt=Date.now();
 updateDayScore(dateKey);
 save();render();
}

function updateDayScore(dateStr){
 initPerf();
 const tasks=Object.entries(state.perf.taskTimers).filter(([k])=>k.startsWith(dateStr+":"));
 if(tasks.length===0)return;
 const onTime=tasks.filter(([,v])=>v.actual&&!v.overtime).length;
 const score=Math.round(onTime/tasks.length*100);
 state.perf.dailyLog=state.perf.dailyLog.filter(d=>d.date!==dateStr);
 state.perf.dailyLog.push({date:dateStr,score,onTime,total:tasks.length});
 save();
}

async function validateReason(dateKey,taskKey,reason,plannedMins,actualSecs){
 initPerf();
 const k=dateKey+":"+taskKey;
 const overMins=Math.round((actualSecs-plannedMins*60)/60);
 const prompt=`I am a beginner platform engineer student (Week ${autoWeek()}/18 of a 18-week learning plan).
I planned to complete a study task in ${plannedMins} minutes but it took ${Math.round(actualSecs/60)} minutes (${overMins} minutes over).
My reason for going over time: "${reason}"

Please do 3 things:
1. VALIDATE: Is this a legitimate reason or an excuse? Be honest but kind. Score it 0-10 (10=completely valid).
2. SUGGEST: One specific thing I can do differently tomorrow to improve time management.
3. PATTERN WARNING: If this sounds like a recurring problem (distraction, underestimating, boredom), name it directly.

Keep response under 100 words. Be direct.`;
 const btn=document.getElementById("validate-btn-"+dateKey+"_"+taskKey);
 const out=document.getElementById("verdict-"+dateKey+"_"+taskKey);
 if(btn)btn.disabled=true;
 if(out)out.innerHTML='<span style="color:var(--accent)">// AI validating...</span>';
 try{
  const text=await callAI(prompt,200);
  if(state.perf.taskTimers[k])state.perf.taskTimers[k].aiVerdict=text;
  if(state.perf.taskTimers[k])state.perf.taskTimers[k].reason=reason;
  updateDayScore(dateKey);
  save();
  if(out)out.innerHTML='<div style="color:var(--yellow);font-size:10px;letter-spacing:1px;margin-bottom:4px">// AI VERDICT</div>'+text.replace(/\n/g,"<br>");
 }catch(e){
  if(out)out.innerHTML='<span style="color:var(--red)">API error: '+e.message+'</span>';
 }
 if(btn)btn.disabled=false;
}

function startDayTimer(){
 initPerf();
 const today=todayStr();
 const sel=document.getElementById("day-plan-hrs");
 const planned=sel?parseInt(sel.value):hoursOf(today);
 state.perf.dayTimers[today]={planned,startedAt:Date.now()};
 save();render();

 if(window._dayTimerIv)clearInterval(window._dayTimerIv);
 window._dayTimerIv=setInterval(()=>{
  const d=state.perf.dayTimers[today];if(!d||!d.startedAt||d.stoppedAt)return;
  const elapsed=Math.floor((Date.now()-d.startedAt)/1000);
  const rem=d.planned*3600-elapsed;
  const disp=document.getElementById("day-tdisp");
  if(disp){
   if(rem>0)disp.textContent=pad(Math.floor(rem/3600))+":"+pad(Math.floor((rem%3600)/60))+":"+pad(rem%60);
   else disp.textContent="-"+pad(Math.floor(-rem/3600))+":"+pad(Math.floor((-rem%3600)/60));
   disp.style.color=rem>0?"var(--green)":"var(--red)";
  }
 },1000);
}

 const phase=state.testPhase||"mcq"; // "mcq" or "interview"
 const answers=state.testAnswers||{};
 let h='<div class="panel"><h2>// WEEKLY TEST · WK'+pad(wk)+' · '+test.topic+'</h2>';

 h+='<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">';
 unlockedWeeks.forEach(w2=>{h+='<button class="shift-btn '+(w2===wk?"on":"")+'" data-testwk="'+w2+'">WK'+pad(w2)+'</button>'});
 h+='</div>';

 h+='<div style="display:flex;gap:6px;margin-bottom:14px">';
 h+='<button class="btn '+(phase==="mcq"?"":"") +'" data-phase="mcq" style="'+(phase==="mcq"?"background:var(--accent);color:var(--card)":"")+'">[ MCQ QUIZ ]</button>';
 h+='<button class="btn" data-phase="interview" style="'+(phase==="interview"?"background:var(--accent);color:var(--card)":"")+'">[ INTERVIEW Qs ]</button>';
 h+='</div>';
 if(phase==="mcq"){
  const q=test.mcq[qIdx];
  const scored=Object.keys(answers).filter(k=>k.startsWith("mcq_"+wk+"_")).length;
  const correct=Object.keys(answers).filter(k=>k.startsWith("mcq_"+wk+"_")&&answers[k]===true).length;
  h+='<div class="muted" style="margin-bottom:6px">Q '+(qIdx+1)+'/'+test.mcq.length+' · Scored: '+correct+'/'+scored+'</div>';
  h+='<div class="bar"><div class="bar-fill" style="width:'+(qIdx/test.mcq.length*100)+'%"></div></div>';
  h+='<div style="border:1px solid var(--accent);padding:14px;margin:12px 0;background:rgba(10,25,50,0.5)"><div style="font-size:12px;font-weight:700;margin-bottom:12px">'+q.q+'</div>';
  const ak="mcq_"+wk+"_"+qIdx;
  const answered=answers[ak]!==undefined;
  q.o.forEach((opt,i)=>{
   let style="border:1px solid var(--line);padding:8px 12px;margin:4px 0;cursor:pointer;font-size:11px;";
   if(answered){
    if(i===q.a)style+="background:var(--card);border-color:var(--accent);";
    else if(answers[ak]===false&&answers["mcq_"+wk+"_"+qIdx+"_sel"]===i)style+="background:#2a0a0a;border-color:var(--red);";
   }
   h+='<div style="'+style+'" '+(answered?"":"data-ans=\""+i+"\"")+'>'+String.fromCharCode(65+i)+'. '+opt+(answered&&i===q.a?" ✓":"")+'</div>';
  });
  if(answered){
   h+='<div style="font-size:11px;margin-top:10px;color:'+(answers[ak]?"var(--green)":"var(--red)")+'">'+( answers[ak]?"✓ CORRECT":"✗ WRONG — correct: "+q.o[q.a])+'</div>';
   if(qIdx<test.mcq.length-1){
    h+='<button class="btn" data-nextq="1" style="margin-top:10px">[ NEXT QUESTION ]</button>';
   }else{

    const wrongs=test.mcq.map((q,i)=>({q,i,correct:answers["mcq_"+wk+"_"+i]===true,sel:answers["mcq_"+wk+"_"+i+"_sel"]})).filter(x=>!x.correct&&x.sel!==undefined);
    const score=correct+"/"+test.mcq.length;
    const pct=Math.round(correct/test.mcq.length*100);
    const passed=pct>=70;

    if(!state.revisionPlan)state.revisionPlan={};
    if(wrongs.length>0){
     state.revisionPlan["wk"+wk]={wk,topic:test.topic,wrongs:wrongs.map(w=>w.q.q),score:pct,savedAt:new Date().toISOString()};
     save();
    }
    h+='</div>';
    h+='<div style="border:2px solid '+(passed?"var(--green)":"var(--red)")+';padding:14px;margin-top:12px;background:rgba(10,25,50,0.5)">';
    h+='<div style="font-size:14px;font-weight:700;color:'+(passed?"var(--green)":"var(--red)")+'">'+( passed?"✓ PASSED":"✗ NEEDS REVISION")+" · "+score+" · "+pct+"%</div>";
    h+='<div class="muted" style="margin-top:4px">'+(passed?"Strong. Proceed to interview questions.":"Below 70%. Weak areas flagged for next week revision.")+'</div>';
    if(wrongs.length>0){
     h+='<div style="margin-top:12px;font-size:10px;letter-spacing:1px;color:var(--red);margin-bottom:6px">✗ WRONG ANSWERS — REVISE THESE:</div>';
     wrongs.forEach(w=>{
      h+='<div style="padding:8px;border:1px dashed var(--border);margin:4px 0;background:rgba(10,25,50,0.4)">';
      h+='<div style="font-size:11px;font-weight:700;color:var(--white)">'+w.q.q+'</div>';
      h+='<div style="font-size:10px;color:var(--red);margin-top:3px">✗ You chose: '+(w.sel!==undefined?w.q.o[w.sel]:"—")+'</div>';
      h+='<div style="font-size:10px;color:var(--green);margin-top:2px">✓ Correct: '+w.q.o[w.q.a]+'</div>';
      h+='</div>';
     });
    }

    const revLinks={
     1:[["Python basics","https://www.hackerrank.com/domains/python"],["IAM docs","https://docs.aws.amazon.com/IAM/latest/UserGuide/"]],
     2:[["VPC docs","https://docs.aws.amazon.com/vpc/"],["Python OOP","https://realpython.com/python3-object-oriented-programming/"]],
     3:[["Lambda docs","https://docs.aws.amazon.com/lambda/"],["Bash scripting","https://www.hackerrank.com/domains/shell"]],
     4:[["SAA practice","https://www.udemy.com/course/ultimate-aws-certified-solutions-architect-associate-saa-c03/"],["boto3 docs","https://boto3.amazonaws.com/v1/documentation/api/latest/"]],
     5:[["Docker docs","https://docs.docker.com/"],["Dockerfile best practices","https://docs.docker.com/develop/dev-best-practices/"]],
     6:[["ECR docs","https://docs.aws.amazon.com/ecr/"],["boto3 S3","https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/s3.html"]],
     7:[["Terraform docs","https://developer.hashicorp.com/terraform/docs"],["TF state","https://developer.hashicorp.com/terraform/language/state"]],
     8:[["Ansible docs","https://docs.ansible.com/"],["Ansible roles","https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_reuse_roles.html"]],
     9:[["GitHub Actions","https://docs.github.com/en/actions"],["ArgoCD docs","https://argo-cd.readthedocs.io/"]],
     10:[["K8s docs","https://kubernetes.io/docs/"],["CKA guide","https://www.udemy.com/course/certified-kubernetes-administrator-with-practice-tests/"]],
     11:[["Helm docs","https://helm.sh/docs/"],["K8s HPA","https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"]],
     12:[["EKS docs","https://docs.aws.amazon.com/eks/"],["ArgoCD IRSA","https://argo-cd.readthedocs.io/en/stable/operator-manual/security/"]],
     13:[["CodePipeline docs","https://docs.aws.amazon.com/codepipeline/"],["AWS Organizations","https://docs.aws.amazon.com/organizations/"]],
     14:[["Prometheus docs","https://prometheus.io/docs/"],["Grafana Loki","https://grafana.com/docs/loki/latest/"],["OpenTelemetry","https://opentelemetry.io/docs/"]],
     15:[["Vault docs","https://developer.hashicorp.com/vault/docs"],["Falco","https://falco.org/docs/"],["GuardDuty","https://docs.aws.amazon.com/guardduty/"]],
     16:[["Google SRE book","https://sre.google/sre-book/table-of-contents/"],["DORA metrics","https://dora.dev/"]],
    };
    const links=revLinks[wk]||[];
    if(links.length>0){
     h+='<div style="margin-top:12px;font-size:10px;letter-spacing:1px;color:var(--accent);margin-bottom:6px">▸ REVISION LINKS:</div>';
     links.forEach(([n,u])=>{h+='<div style="padding:3px 0"><a href="'+u+'" target="_blank" style="font-size:11px">▸ '+n+'</a></div>'});
    }

    h+='<div style="margin-top:12px;font-size:10px;letter-spacing:1px;color:var(--accent);margin-bottom:6px">▸ WHAT TO DO NEXT:</div>';
    if(wrongs.length===0){
     h+='<div style="font-size:11px;color:var(--green)">Perfect or strong score. Move to interview questions → practise answers aloud.</div>';
    }else if(pct<50){
     h+='<div style="font-size:11px;color:var(--red)">Score below 50%. Rewatch Week '+wk+' course sections before proceeding. Revision task auto-added to next week.</div>';
    }else{
     h+='<div style="font-size:11px;color:var(--white)">Re-read wrong answers above. Spend 30 min on the revision links. Then do interview questions. Revision task added to next week.</div>';
    }
    if(wrongs.length>0)h+='<div style="margin-top:8px;font-size:10px;color:var(--yellow)">✓ AUTO-REVISION TASK added to Week '+(wk+1)+' plan</div>';
    h+='<div style="margin-top:12px;display:flex;gap:6px"><button class="btn" data-phase="interview">[ GO TO INTERVIEW Qs ]</button><button class="btn" data-retake="'+wk+'">[ RETAKE MCQ ]</button></div>';
    h+='</div>';
    return h+"</div>";
   }
  }
  h+='</div>';
 }else{

  h+='<div class="muted" style="margin-bottom:10px">'+test.interview.length+' PBC-style questions for Week '+wk+'. Read, reflect, prepare your answer out loud or in a note.</div>';
  test.interview.forEach((iq,i)=>{
   h+='<div style="padding:12px;border:1px dashed var(--line);margin:8px 0;background:rgba(10,25,50,0.5)">';
   h+='<div style="font-size:10px;letter-spacing:1px;color:var(--dim);margin-bottom:6px">Q'+(i+1)+' · PLATFORM ENGINEER INTERVIEW</div>';
   h+='<div style="font-size:12px;line-height:1.6">'+iq+'</div>';
   const rk="intr_"+wk+"_"+i;
   h+='<label class="chk" style="margin-top:8px"><input type="checkbox" data-rk="'+rk+'" '+(state.t[rk]?"checked":"")+'><span style="font-size:10px;color:var(--dim)">I practised this answer</span></label>';
   h+='</div>';
  });
  const practised=test.interview.filter((_,i)=>state.t["intr_"+wk+"_"+i]).length;
  h+='<div style="margin-top:10px;font-size:11px;color:var(--accent)">'+practised+'/'+test.interview.length+' answers practised</div>';
 }
 h+='</div>';
 return h;
}

async function generateInterviewQuestions(ivIdx){
 const iv=(state.interviews||[])[ivIdx];
 if(!iv)return;
 const out=document.getElementById("iv-questions-"+ivIdx);
 const btn=document.getElementById("iv-gen-btn-"+ivIdx);
 if(!out)return;
 if(btn)btn.disabled=true;
 out.innerHTML='<div style="color:var(--accent)">// Gemini generating questions...</div>';
 const prompt=`You are a senior technical interviewer at a product-based company.

Company: ${iv.company}
Role: ${iv.role}
Interview date: ${iv.date}

Job Description:
${iv.jd||"Not provided"}

Candidate Resume Summary:
${iv.resume||"Not provided"}

Generate 15 targeted interview questions for this candidate for this specific role. Include:
- 5 technical questions (based on the JD tech stack)
- 4 behavioral questions (STAR format prompts)
- 3 system design questions (relevant to the role)
- 2 questions about the candidate's resume experience
- 1 salary negotiation tip specific to this role

Format clearly with section headers. Be specific to the JD, not generic.`;
 try{
  const text=await callAI(prompt,1000);
  if(state.interviews[ivIdx])state.interviews[ivIdx].questions=text;
  save();
  out.innerHTML='<div style="font-size:9px;color:var(--teal);letter-spacing:1px;margin-bottom:8px">// GEMINI · CUSTOM INTERVIEW QUESTIONS · '+iv.company+'</div>'+
   text.replace(/#{1,3} (.+)/g,'<div style="font-size:11px;font-weight:700;color:var(--accent);margin:10px 0 5px">$1</div>')
       .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
       .replace(/\n/g,'<br>');
 }catch(e){
  out.innerHTML='<span style="color:var(--red)">Error: '+e.message+'</span>';
 }
 if(btn)btn.disabled=false;
}

 const EASY_PUZZLES=[
  "530070000600195000098000060800060003400803001700020006060000280000419005000080079","020000000000600003074080000600000020000000001003400500400200800008006040500009700",
 ];
 const HARD_PUZZLES=[
  "800000000003600000070090200060005030004000010090150700002800003500280090000070600","000000907000420180000705026100904000050000040000507009920108000034059000507000000",
 ];
 let sudokuBoard=[],sudokuSolution=[],sudokuGiven=[];

 function solveSudoku(board){
  const empty=board.indexOf(0);
  if(empty===-1)return true;
  const row=Math.floor(empty/9),col=empty%9;
  for(let n=1;n<=9;n++){
   let ok=true;
   for(let i=0;i<9;i++){
    if(board[row*9+i]===n||board[i*9+col]===n)ok=false;
   }
   const br=Math.floor(row/3)*3,bc=Math.floor(col/3)*3;
   for(let r=br;r<br+3;r++)for(let c=bc;c<bc+3;c++)if(board[r*9+c]===n)ok=false;
   if(ok){board[empty]=n;if(solveSudoku(board))return true;board[empty]=0}
  }
  return false;
 }

 function renderSudoku(){
  const b=document.getElementById("sudoku-board");if(!b)return;
  let h='<table style="border-collapse:collapse;font-size:13px">';
  for(let r=0;r<9;r++){
   h+='<tr>';
   for(let c=0;c<9;c++){
    const idx=r*9+c;
    const val=sudokuBoard[idx];
    const given=sudokuGiven[idx];
    const borderR=c===2||c===5?"3px solid var(--white)":"1px solid var(--border)";
    const borderB=r===2||r===5?"3px solid var(--white)":"1px solid var(--border)";
    if(given){
     h+='<td style="width:30px;height:30px;text-align:center;border-right:'+borderR+';border-bottom:'+borderB+';color:var(--accent);font-weight:700;background:rgba(10,25,50,0.4)">'+val+'</td>';
    }else{
     h+='<td style="width:30px;height:30px;text-align:center;border-right:'+borderR+';border-bottom:'+borderB+';background:var(--card)"><input type="number" min="1" max="9" data-idx="'+idx+'" value="'+(val||"")+'" style="width:26px;height:26px;text-align:center;background:transparent;border:none;color:var(--white);font:inherit;font-size:13px"></td>';
    }
   }
   h+='</tr>';
  }
  h+='</table>';
  b.innerHTML=h;
  b.querySelectorAll("input[data-idx]").forEach(inp=>inp.oninput=e=>{
   const v=parseInt(e.target.value)||0;
   sudokuBoard[parseInt(inp.dataset.idx)]=v>0&&v<=9?v:0;
  });
 }

 function loadSudoku(puzzles){
  const p=puzzles[Math.floor(Math.random()*puzzles.length)];
  sudokuBoard=p.split("").map(Number);
  sudokuGiven=sudokuBoard.map(v=>v!==0);
  sudokuSolution=[...sudokuBoard];
  solveSudoku(sudokuSolution);
  const msg=document.getElementById("sudoku-msg");if(msg)msg.textContent="";
  renderSudoku();
 }

 const seasy=document.getElementById("sudoku-new-easy");
 const shard=document.getElementById("sudoku-new-hard");
 const scheck=document.getElementById("sudoku-check");
 if(seasy)seasy.onclick=()=>loadSudoku(EASY_PUZZLES);
 if(shard)shard.onclick=()=>loadSudoku(HARD_PUZZLES);
 if(scheck)scheck.onclick=()=>{
  const msg=document.getElementById("sudoku-msg");
  if(sudokuBoard.length===0){if(msg)msg.textContent="Start a puzzle first";return}
  const complete=sudokuBoard.every((v,i)=>v===sudokuSolution[i]);
  const filled=sudokuBoard.every(v=>v!==0);
  if(complete){if(msg){msg.textContent="✓ SOLVED! 🎉";msg.style.color="var(--green)"}}
  else if(filled){if(msg){msg.textContent="✗ Errors found — keep trying";msg.style.color="var(--red)"}}
  else{if(msg){msg.textContent="Keep going...";msg.style.color="var(--yellow)"}}
 };
